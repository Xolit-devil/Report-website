<p class="page-issue">
  <a id="page-issue-link" href="https://github.com/xolit-devil/Report-website/issues/new">Comment on this page</a>
</p>
<script>
  // Pre-fill the issue title with the page heading so comments can be traced to a page.
  (function () {
    var h = document.querySelector("h1.title");
    var a = document.getElementById("page-issue-link");
    var name = h ? h.textContent.trim() : document.title;
    if (a && name) a.href += "?title=" + encodeURIComponent("[" + name + "] ");
  })();
</script>
