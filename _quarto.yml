project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/**/*.qmd"
  resources:
    - design-compare.html
    - "research/*/thumb.png"
    - "research/*/banner.png"
    - "research/*/banner-over.png"

website:
  title: "Reports"
  site-url: https://xolit-devil.github.io/Report-website/
  repo-url: https://github.com/xolit-devil/Report-website
  search: false
  # Top bar. It slides away when scrolling down and returns when scrolling up.
  navbar:
    title: false
    pinned: false
    collapse: false
    left:
      - text: Me
        href: about.qmd
      - text: Reports
        href: research/index.qmd
      - text: Page
        href:  index.qmd
      - text: Blogs
        href: blog.qmd
  page-footer:
    center: "Criticism and advice is what this website was built for: [open an issue on GitHub](https://github.com/xolit-devil/Report-website/issues/new)."



bibliography: references.bib

format:
  html:
    theme: [default, custom.scss, design-preview.scss]
    include-in-header:
      - _mode-toggle.html
      - _design-preview.html
    # "Comment on this page" link at the foot of every page.
    include-after-body: _page-issue.html
    page-layout: article
    grid:
      body-width: 700px
      sidebar-width: 0px
      margin-width: 0px
    toc: false
    link-external-newwindow: true
