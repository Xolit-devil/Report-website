project:
  type: website
  output-dir: _site
  # Only .qmd files are pages. CLAUDE.md, about.md, style.md and Projects/ are working notes.
  render:
    - "*.qmd"
    - "research/**/*.qmd"
  resources:
    - design-compare.html
    - "research/*/thumb.png"

website:
  title: "Reports"
  site-url: https://xolit-devil.github.io/Report-website/
  repo-url: https://github.com/xolit-devil/Report-website
  page-footer:
    center: "Criticism and advice is what this website was built for: [open an issue on GitHub](https://github.com/xolit-devil/Report-website/issues/new)."


bibliography: references.bib

format:
  html:
    theme: [default, custom.scss, design-preview.scss]
    include-in-header: _design-preview.html
    page-layout: article
    grid:
      body-width: 700px
      sidebar-width: 0px
      margin-width: 0px
    toc: false
    link-external-newwindow: true
